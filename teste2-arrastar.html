<!doctype html>

<title>Teste Treino de Engenharia Web</title>

<style>
/* Layout: coluna única de leitura; barra de progresso fixa no topo; cada pergunta é uma ficha numerada pela ordem do teste */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#15212b; --muted:#5b6872; --line:#d7dedb;
  --accent:#0f6e6a; --accent-ink:#ffffff; --code-bg:#eef2f1;
  --ok:#1d7a3e; --ok-bg:#e3f3e8; --bad:#b3261e; --bad-bg:#fbe7e5; --warn-bg:#fff4d6; --warn:#7a5a00;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181d; --surface:#18222a; --ink:#e4ebe8; --muted:#97a5ad; --line:#2b3841;
  --accent:#4cc1b8; --accent-ink:#0b1714; --code-bg:#0f171c;
  --ok:#6fd492; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a18; --warn-bg:#352b0e; --warn:#f2cf6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181d; --surface:#18222a; --ink:#e4ebe8; --muted:#97a5ad; --line:#2b3841;
  --accent:#4cc1b8; --accent-ink:#0b1714; --code-bg:#0f171c;
  --ok:#6fd492; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a18; --warn-bg:#352b0e; --warn:#f2cf6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.tabs{display:flex;gap:4px;background:var(--code-bg);padding:4px;border-radius:8px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .9rem var(--f-body);padding:7px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.score{margin-left:auto;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.score b{color:var(--ink);font-size:1.05rem}
.bar{width:110px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
main .wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
.intro{color:var(--muted);font-size:.92rem;max-width:65ch;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 .88rem var(--f-body);padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.tabs button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{scroll-margin-top:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.q-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{font:600 .75rem var(--f-mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.tag.rep{border-color:var(--accent);color:var(--accent)}
.status{margin-left:auto;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.prompt{margin:0;max-width:70ch;text-wrap:pretty}
.prompt code,.exp code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt .l{font:600 .85rem var(--f-mono);color:var(--muted);min-width:1.2em}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.tf{flex-direction:row;flex-wrap:wrap}
.tf .opt{flex:1 1 140px}
.codebox{overflow-x:auto;background:var(--code-bg);border:1px solid var(--line);border-radius:8px}
pre{margin:0;padding:14px 16px;font:400 .82rem/1.75 var(--f-mono);white-space:pre;color:var(--ink)}
pre .file{color:var(--muted);font-weight:600}
pre select{font:600 .8rem var(--f-mono);color:var(--ink);background:var(--surface);border:1px dashed var(--accent);border-radius:4px;padding:1px 2px;max-width:330px}
pre select.ok{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok)}
pre select.bad{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad)}
.fix{font:600 .72rem var(--f-mono);color:var(--ok);margin-left:2px}
.exp{border-left:3px solid var(--accent);background:var(--code-bg);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.92rem;max-width:72ch}
.exp p{margin:0 0 6px} .exp p:last-child{margin:0}
.exp ol{margin:4px 0 0;padding-left:1.4em} .exp li{margin:2px 0}
.note{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:6px;font-size:.88rem;max-width:72ch}
.q-foot{display:flex;gap:8px;flex-wrap:wrap}
.summary{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:16px 20px}
.summary h2{margin:0 0 4px;font-size:1.1rem}
.summary p{margin:0;color:var(--muted)}

.resumo{display:flex;flex-direction:column;gap:18px}
.rs{scroll-margin-top:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rs h2{margin:0;font-size:1.12rem;letter-spacing:-.01em;text-wrap:balance}
.rs h3{margin:6px 0 0;font-size:.95rem}
.rs p,.rs li{max-width:70ch}
.rs p{margin:0}
.rs ol,.rs ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.rs code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.rs pre code{background:none;padding:0;font-size:inherit}
.rs table{border-collapse:collapse;font-size:.88rem;width:100%}
.rs th,.rs td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rs th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tblbox{overflow-x:auto}
.go{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.go button{font:600 .78rem var(--f-mono);border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:2px 10px;cursor:pointer}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.85rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--surface)}
.trap{background:var(--bad-bg);color:var(--bad);font-weight:600;padding:0 5px;border-radius:4px;font-family:var(--f-mono);font-size:.84em}

.toplink{font-size:.88rem;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 12px}
.drop{display:inline-block;min-width:8ch;padding:0 8px;margin:1px 0;border:1.5px dashed var(--accent);border-radius:5px;background:var(--surface);color:var(--muted);font-weight:600;text-align:center;cursor:pointer;vertical-align:baseline;line-height:1.5;touch-action:none;user-select:none}

.drop.over{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.drop.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.drop.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bank{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chip{font:600 .8rem var(--f-mono);padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;user-select:none;max-width:100%;overflow-wrap:anywhere;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.picked{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font:600 .8rem var(--f-mono);padding:6px 10px;border-radius:6px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.25);margin:-14px 0 0 -20px}
body.dragging{cursor:grabbing;user-select:none}
@media (max-width:520px){.score{margin-left:0;width:100%}.q{padding:14px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

const state = {t2:{}};
let cur = "t2";
const app = document.getElementById("app");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const L = "abcdefgh";

function render(){
  const sc = document.querySelector(".score");
  sc.hidden=false;
  const test = T[cur];
  document.getElementById("tot").textContent = test.qs.length;
  let h = `<p class="intro">${test.qs.length} perguntas de treino. Nas perguntas de preencher, <b>arrasta</b> cada caixa para o espaço certo no código (ou toca numa caixa e depois no espaço). Cada caixa pode ser usada várias vezes. Para tirar uma resposta, arrasta-a para fora do código ou toca no espaço duas vezes.</p>
  <div class="actions"><button class="btn primary" id="checkAll">Corrigir teste</button><button class="btn" id="showAll">Mostrar todas as respostas</button><button class="btn" id="reset">Recomeçar</button></div>`;
  test.qs.forEach((q,i)=>{
    const id = `${cur}-q${i}`;
    const kind = {mc:"Escolha múltipla", tf:"Verdadeiro / Falso", fill:"Preencher"}[q.type];
    h += `<section class="q" id="${id}"><div class="q-head"><span class="num">Pergunta ${i+1}</span><span class="tag">${kind}</span><span class="status" id="${id}-st"></span></div>
    <p class="prompt">${q.q}</p>`;
    if(q.pre) h += `<div class="codebox"><pre>${esc(q.pre)}</pre></div>`;
    if(q.type==="mc"){
      h += `<div class="opts">` + q.opts.map((o,j)=>`<label class="opt" id="${id}-o${j}"><input type="radio" name="${id}" id="${id}-r${j}" value="${j}"><span class="l">${L[j]}.</span><span>${esc(o)}</span></label>`).join("") + `</div>`;
    } else if(q.type==="tf"){
      h += `<div class="opts tf">` + [["true","Verdadeiro"],["false","Falso"]].map(([v,t])=>`<label class="opt" id="${id}-o${v}"><input type="radio" name="${id}" id="${id}-r${v}" value="${v}"><span>${t}</span></label>`).join("") + `</div>`;
    } else {
      const bank = [...new Set(q.bank)].sort((a,b)=>a.localeCompare(b,"pt",{sensitivity:"base"}));
      const zone = k => `<span class="drop" id="${id}-b${k}" data-v="" tabindex="0" role="button" aria-label="Espaço ${+k+1}">${+k+1}</span>`;
      h += `<div class="codebox"><pre>${q.code.replace(/\[\[(\d+)\]\]/g,(m,k)=>zone(k))}</pre></div>`;
      h += `<div class="bank" aria-label="Opções">${shuffle(bank).map(b=>`<button type="button" class="chip" data-v="${esc(b)}">${esc(b)}</button>`).join("")}</div>`;
    }
    if(q.note) h += `<div class="note" hidden id="${id}-note">${q.note}</div>`;
    h += `<div class="exp" hidden id="${id}-exp">${q.exp}</div>
    <div class="q-foot"><button class="btn primary" data-check="${i}">Verificar</button><button class="btn" data-show="${i}">Ver resposta</button></div></section>`;
  });
  h += `<div class="summary" id="summary" hidden></div>`;
  app.innerHTML = h;
  // repor respostas guardadas na sessão
  const st = state[cur];
  Object.entries(st.vals||{}).forEach(([k,v])=>{const el=document.getElementById(k); if(!el)return; if(el.type==="radio") el.checked=v; else setVal(el,v,true);});
  Object.keys(st.checked||{}).forEach(i=>check(+i,false));
  updateScore();
}

function remember(e){
  const t=e.target; if(!t.id) return;
  const st = state[cur]; st.vals = st.vals||{};
  if(t.type==="radio"){ document.querySelectorAll(`input[name="${t.name}"]`).forEach(r=>st.vals[r.id]=r.checked); }
  else st.vals[t.id]=t.value;
}

function check(i, reveal){
  const q = T[cur].qs[i], id = `${cur}-q${i}`, st = state[cur];
  st.checked = st.checked||{}; st.score = st.score||{};
  let pts = 0;
  if(q.type==="mc"||q.type==="tf"){
    const chosen = document.querySelector(`input[name="${id}"]:checked`);
    const right = q.type==="mc" ? String(q.a) : String(q.a);
    const opts = q.type==="mc" ? q.opts.map((_,j)=>String(j)) : ["true","false"];
    opts.forEach(v=>{const o=document.getElementById(`${id}-o${v}`); o.classList.remove("ok","bad");
      if(v===right) o.classList.add("ok"); else if(chosen && chosen.value===v) o.classList.add("bad");});
    pts = chosen && chosen.value===right ? 1 : 0;
    setStatus(id, pts===1 ? "Certa" : (chosen?"Errada":"Sem resposta"), pts===1);
  } else {
    let ok = 0; const n = q.ans.length; const vals=[];
    q.ans.forEach((acc,k)=>{ const s=document.getElementById(`${id}-b${k}`); vals[k]=s.dataset.v||""; });
    const good = q.ans.map((acc,k)=>acc.includes(vals[k]));
    (q.same||[]).forEach(g=>{ const v=vals[g[0]]; if(!g.every(k=>vals[k]===v)) g.forEach(k=>good[k]=false); });
    // as duas ações na pergunta de rotas não podem repetir-se
    if(q.ans.length===13 && q.bank.includes("PracticalTest") && vals[11]===vals[12]) {good[11]=false;good[12]=false;}
    q.ans.forEach((acc,k)=>{
      const s=document.getElementById(`${id}-b${k}`); s.classList.remove("ok","bad");
      const nx = s.nextElementSibling; if(nx && nx.classList.contains("fix")) nx.remove();
      if(good[k]){ s.classList.add("ok"); ok++; }
      else { s.classList.add("bad"); const f=document.createElement("span"); f.className="fix"; f.textContent="→ "+acc[0]; s.after(f); }
    });
    pts = ok/n;
    setStatus(id, `${ok}/${n} espaços certos`, ok===n);
  }
  st.checked[i]=true; st.score[i]=pts;
  document.getElementById(`${id}-exp`).hidden=false;
  const nt=document.getElementById(`${id}-note`); if(nt) nt.hidden=false;
  updateScore();
}

function show(i){
  const q = T[cur].qs[i], id = `${cur}-q${i}`;
  if(q.type==="mc"||q.type==="tf"){ const r=document.getElementById(`${id}-r${String(q.a)}`); r.checked=true; r.dispatchEvent(new Event("change",{bubbles:true})); }
  else q.ans.forEach((acc,k)=>{ const s=document.getElementById(`${id}-b${k}`); setVal(s,acc[0]); });
  check(i);
}

function setStatus(id, txt, ok){ const s=document.getElementById(`${id}-st`); s.textContent=txt; s.className="status "+(ok?"ok":"bad"); }

function updateScore(){
  const st = state[cur], n = T[cur].qs.length;
  const total = Object.values(st.score||{}).reduce((a,b)=>a+b,0);
  const fmt = x => (Math.round(x*10)/10).toString().replace(".",",");
  document.getElementById("sc").textContent = fmt(total);
  document.getElementById("scbar").style.width = (total/n*100)+"%";
  const done = Object.keys(st.checked||{}).length, sm=document.getElementById("summary");
  if(sm && done===n){ sm.hidden=false; sm.innerHTML=`<h2>${fmt(total)} em ${n} (${Math.round(total/n*20*10)/10} valores em 20)</h2><p>As perguntas de preencher contam proporcionalmente aos espaços certos. Carrega em <b>Recomeçar</b> para voltar a tentar.</p>`; }
}


function shuffle(a){ a=[...a]; let seed=7; for(let i=a.length-1;i>0;i--){ seed=(seed*9301+49297)%233280; const j=Math.floor(seed/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function setVal(z, v, silent){
  z.dataset.v = v||""; z.textContent = v || (+z.id.split("-b")[1]+1);
  z.classList.toggle("filled", !!v); z.classList.remove("ok","bad");
  const nx=z.nextElementSibling; if(nx && nx.classList.contains("fix")) nx.remove();
  if(!silent){ const st=state[cur]; st.vals=st.vals||{}; st.vals[z.id]=v||""; }
}
// arrastar com rato e com dedo (pointer events) + tocar para escolher
let picked=null, drag=null;
function clearPick(){ if(picked){ picked.classList.remove("picked"); picked=null; } }
app.addEventListener("pointerdown", e=>{
  const src = e.target.closest(".chip, .drop.filled"); if(!src || e.button>0) return;
  drag = {src, v:src.dataset.v, x:e.clientX, y:e.clientY, ghost:null, moved:false};
});
window.addEventListener("pointermove", e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
  if(!drag.moved){ drag.moved=true; clearPick(); const g=document.createElement("div"); g.className="ghost"; g.textContent=drag.v; document.body.appendChild(g); drag.ghost=g; document.body.classList.add("dragging"); }
  e.preventDefault();
  drag.ghost.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
  document.querySelectorAll(".drop.over").forEach(d=>d.classList.remove("over"));
  const t=document.elementFromPoint(e.clientX,e.clientY); const z=t && t.closest(".drop"); if(z) z.classList.add("over");
}, {passive:false});
window.addEventListener("pointerup", e=>{
  if(!drag) return; const d=drag; drag=null;
  if(!d.moved) return; // foi um toque: o click trata
  d.ghost.remove(); document.body.classList.remove("dragging");
  document.querySelectorAll(".drop.over").forEach(z=>z.classList.remove("over"));
  const t=document.elementFromPoint(e.clientX,e.clientY); const z=t && t.closest(".drop");
  const fromZone = d.src.classList.contains("drop");
  if(z && z!==d.src){
    if(z.closest(".q")!==d.src.closest(".q")) return;
    if(fromZone){ const old=z.dataset.v; setVal(z,d.v); setVal(d.src,old); } else setVal(z,d.v);
  } else if(!z && fromZone && !(t && t.closest(".codebox"))) setVal(d.src,"");
  suppressClick=true; setTimeout(()=>suppressClick=false,0);
});
window.addEventListener("pointercancel", ()=>{ if(drag&&drag.ghost){drag.ghost.remove();document.body.classList.remove("dragging");} drag=null; });
let suppressClick=false;
app.addEventListener("click", e=>{
  if(suppressClick){ e.stopImmediatePropagation(); return; }
  const chip=e.target.closest(".chip");
  if(chip){ const same=picked===chip; clearPick(); if(!same){ picked=chip; chip.classList.add("picked"); } return; }
  const z=e.target.closest(".drop");
  if(z){ if(picked && picked.closest(".q")===z.closest(".q")){ setVal(z,picked.dataset.v); clearPick(); } else if(z.classList.contains("filled")) { if(z.dataset.armed){ setVal(z,""); delete z.dataset.armed; } else { z.dataset.armed="1"; setTimeout(()=>delete z.dataset.armed,600); } } }
}, true);
app.addEventListener("keydown", e=>{ const z=e.target.closest(".drop"); if(z && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); if(picked){ setVal(z,picked.dataset.v); clearPick(); } } if(z && (e.key==="Backspace"||e.key==="Delete")) setVal(z,""); });

app.addEventListener("change", remember);
app.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.go){ const [t,i]=b.dataset.go.split(":"); document.getElementById("tab-"+t).click(); setTimeout(()=>{const el=document.getElementById(`${t}-q${i}`); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});},50); return; }
  if(b.dataset.check) check(+b.dataset.check);
  else if(b.dataset.show) show(+b.dataset.show);
  else if(b.id==="checkAll"){ T[cur].qs.forEach((_,i)=>check(i)); document.getElementById("summary").scrollIntoView({behavior:"smooth",block:"center"}); }
  else if(b.id==="showAll"){ T[cur].qs.forEach((_,i)=>show(i)); }
  else if(b.id==="reset"){ state[cur]={}; render(); window.scrollTo({top:0}); }
});
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  cur=b.dataset.t; document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected", x===b)); render(); window.scrollTo({top:0});
}));
render();
